<h2 data-number="17.16"
id="99-appendices-final-report-revision-audit"><span
class="header-section-number">17.16</span> Final report revision
audit</h2>
<ul class="task-list">
<li><label><input type="checkbox" />The executive summary leads with
findings and actions.</label></li>
<li><label><input type="checkbox" />Every major section advances the
same decision problem.</label></li>
<li><label><input type="checkbox" />Main EDA findings are integrated
into the report body.</label></li>
<li><label><input type="checkbox" />Segment descriptions separate
observations from assumptions.</label></li>
<li><label><input type="checkbox" />Forecasts, projections, scenarios,
and targets are labelled correctly.</label></li>
<li><label><input type="checkbox" />Recommendation effects are not
presented as measured outcomes without evidence.</label></li>
<li><label><input type="checkbox" />Secondary comparisons use compatible
definitions and denominators.</label></li>
<li><label><input type="checkbox" />Machine-learning results include a
baseline, validation, and useful metrics.</label></li>
<li><label><input type="checkbox" />Figures remain legible at final
size.</label></li>
<li><label><input type="checkbox" />Repetition and nonessential detail
have been removed.</label></li>
</ul>
