<h2 data-number="17.15"
id="99-appendices-interim-review-checklist"><span
class="header-section-number">17.15</span> Interim review checklist</h2>
<ul class="task-list">
<li><label><input type="checkbox" />The current problem, audience, and
scope are clear.</label></li>
<li><label><input type="checkbox" />Completed, preliminary, and planned
work are distinguished.</label></li>
<li><label><input type="checkbox" />Progress is supported by observable
evidence.</label></li>
<li><label><input type="checkbox" />Data issues, open questions, and
risks are visible.</label></li>
<li><label><input type="checkbox" />Model and projection plans include
validation.</label></li>
<li><label><input type="checkbox" />Project trajectory is supported by
the schedule.</label></li>
<li><label><input type="checkbox" />Feedback and decision requests are
specific.</label></li>
<li><label><input type="checkbox" />Next actions have owners and
dates.</label></li>
</ul>
<script>
(function () {
  function removeExampleParentheses() {
    document.querySelectorAll('.example').forEach(function (box) {
      const labelArea = box.querySelector(':scope > p:first-child') || box.firstElementChild || box;
      const walker = document.createTreeWalker(labelArea, NodeFilter.SHOW_TEXT);
      let node;

      while ((node = walker.nextNode())) {
        if (!/^\s*\(Example\b/i.test(node.nodeValue)) continue;

        node.nodeValue = node.nodeValue
          .replace(/^(\s*)\(Example(\s+\d+(?:\.\d+)*)\)/i, '$1Example$2')
          .replace(/^(\s*)\(Example\b/i, '$1Example');
        break;
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', removeExampleParentheses);
  } else {
    removeExampleParentheses();
  }
}());
</script>
