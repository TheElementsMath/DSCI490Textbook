<h2 data-number="17.7"
id="99-appendices-data-dictionary-review-checklist"><span
class="header-section-number">17.7</span> Data dictionary review
checklist</h2>
<ul class="task-list">
<li><label><input type="checkbox" />Dataset version, date received,
dimensions, source, and unit are recorded.</label></li>
<li><label><input type="checkbox" />Every table has a grain and
key.</label></li>
<li><label><input type="checkbox" />Every source and derived variable
has one dictionary row.</label></li>
<li><label><input type="checkbox" />Definitions explain business meaning
rather than repeat names.</label></li>
<li><label><input type="checkbox" />Types, formats, units, allowed
values, and examples are clear.</label></li>
<li><label><input type="checkbox" />Missing-value codes and counts are
documented, including zero missingness.</label></li>
<li><label><input type="checkbox" />Constraints, relationships,
derivations, and ownership are recorded.</label></li>
<li><label><input type="checkbox" />Privacy or sensitivity
classifications are visible.</label></li>
<li><label><input type="checkbox" />The dictionary matches the final
analytical data.</label></li>
</ul>
