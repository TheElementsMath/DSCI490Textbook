<h2 data-number="17.17"
id="99-appendices-final-deliverable-checklist"><span
class="header-section-number">17.17</span> Final deliverable
checklist</h2>
<ul class="task-list">
<li><label><input type="checkbox" />Reported values reconcile with the
analysis.</label></li>
<li><label><input type="checkbox" />The report and presentation share
the same conclusions.</label></li>
<li><label><input type="checkbox" />Recommendations are supported,
feasible, and measurable.</label></li>
<li><label><input type="checkbox" />Limitations and assumptions are
visible.</label></li>
<li><label><input type="checkbox" />Figures and tables are labelled,
sourced, and accessible.</label></li>
<li><label><input type="checkbox" />Appendices provide necessary
technical support.</label></li>
<li><label><input type="checkbox" />The executive summary stands
alone.</label></li>
<li><label><input type="checkbox" />Presentation timing, transitions,
participation, and questions have been rehearsed.</label></li>
<li><label><input type="checkbox" />Confidentiality requirements are
satisfied.</label></li>
<li><label><input type="checkbox" />Handoff files are documented,
clearly named, and usable.</label></li>
</ul>
